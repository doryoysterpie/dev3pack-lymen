name: lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # GitHub cancels the job after 15 minutes, so a step that hangs does not hold the run open.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Scan regular tracked files for PEM private-key headers, Ed25519 PKCS#8 DER (v1/v2) headers, and Solana Ed25519 keypairs; fail on unreadable or non-regular tracked paths
        run: node services/api/src/key-scan.ts
      - name: ESLint
        run: npm run lint
      - name: Prettier check
        run: npm run format:check
      - name: TypeScript --noEmit
        run: npm run typecheck
      - name: Tests
        run: npm test
