<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>limen station</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #101214;
        --fg: #f2f2f2;
        --muted: #a8adb3;
        --alert: #ffb4a8;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font:
          20px/1.4 system-ui,
          sans-serif;
        text-align: center;
      }
      main {
        padding: 16px;
      }
      /* The logo (E-19) is a black wordmark. Its descender is a fifth of its height, so it sits
         that far below the line, and it is inverted to read on the dark page. */
      .logo {
        height: 1.1em;
        vertical-align: -0.2em;
        filter: invert(1);
      }
      canvas {
        display: block;
        margin: 0 auto 16px;
        max-width: 100%;
        height: auto;
        background: #fff;
      }
      [hidden] {
        display: none !important;
      }
      #caption {
        color: var(--muted);
      }
      #problem {
        color: var(--alert);
      }
      #token-prompt label {
        display: block;
        margin-bottom: 8px;
      }
      #token-prompt input,
      #token-prompt button {
        font: inherit;
        padding: 8px 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>
        Scan with <img class="logo" src="/src/limen-logo.svg" alt="limen" /> to
        check in
      </h1>
      <canvas id="qr" hidden></canvas>
      <p id="caption"></p>
      <p id="problem" role="alert" hidden></p>
      <!-- Not a form: nothing here is submitted to a URL. main.ts reads the field and keeps
           the token in memory. -->
      <div id="token-prompt" hidden>
        <label for="token">Paste this station's display token.</label>
        <input
          id="token"
          type="password"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
        />
        <button id="token-start" type="button">Show the QR</button>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
